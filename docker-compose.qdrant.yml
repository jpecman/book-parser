services:
  qdrant:
    # Fully qualified so podman resolves it without a short-name registry prompt.
    image: docker.io/qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: '${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}'
    ports:
      - '${QDRANT_BIND_ADDR:-0.0.0.0}:${QDRANT_HTTP_PORT:-6333}:6333' # REST API + dashboard
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: qdrant_storage

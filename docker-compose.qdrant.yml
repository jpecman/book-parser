services:
  qdrant:
    # Fully qualified so podman resolves it without a short-name registry prompt.
    image: docker.io/qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      # Bound to localhost only: Qdrant has no authentication by default.
      - '127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333' # REST API + dashboard
      - '127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334' # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    # Fixed name so compose and qdrant-in-podman.sh share the same volume.
    name: qdrant_storage

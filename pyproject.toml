[project]
name = "book-parser"
version = "0.1.0"
description = "Extracts text from books and stores it in a vector database"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "qdrant-client",
]

[project.scripts]
book-parser = "book_parser.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
